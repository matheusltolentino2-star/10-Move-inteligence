<!-- Captura de falhas ANTES de qualquer script da aplicação.
     Se um arquivo não carregar ou não for interpretado, nada do app existe —
     nem o vigia do boot — e a tela ficaria girando sem explicação. Este
     trecho é inline de propósito: precisa funcionar mesmo que todo o resto
     falhe. -->
<script>
(function () {
  var erros = [];
  function mostrar(titulo) {
    var alvo = document.getElementById('boot-msg');
    if (!alvo) return;
    while (alvo.firstChild) alvo.removeChild(alvo.firstChild);
    var h = document.createElement('div');
    h.style.cssText = 'color:#ff9b94;font-weight:600;margin-bottom:10px;font-size:13px';
    h.textContent = titulo || 'A aplicação não conseguiu iniciar neste navegador.';
    alvo.appendChild(h);
    erros.slice(0, 5).forEach(function (t) {
      var p = document.createElement('div');
      p.style.cssText = 'color:#9fb6cd;font-size:11.5px;margin-bottom:5px;word-break:break-word;text-align:left';
      p.textContent = '• ' + t;
      alvo.appendChild(p);
    });
    var r = document.createElement('div');
    r.style.cssText = 'color:#6f89a5;font-size:10.5px;margin-top:10px';
    r.textContent = 'Copie este texto e envie para quem cuida do sistema.';
    alvo.appendChild(r);
  }
  window.addEventListener('error', function (ev) {
    var alvo = ev.target;
    if (alvo && (alvo.tagName === 'SCRIPT' || alvo.tagName === 'LINK')) {
      var u = alvo.src || alvo.href || '';
      erros.push('não carregou: ' + u.split('/').slice(-1)[0]);
    } else {
      erros.push((ev.message || 'erro') +
        (ev.filename ? ' — ' + ev.filename.split('/').slice(-1)[0] + ':' + ev.lineno : ''));
    }
    mostrar();
  }, true);
  window.addEventListener('unhandledrejection', function (ev) {
    var r = ev.reason;
    erros.push('promessa rejeitada: ' + ((r && r.message) || r));
    mostrar();
  });
  window.MI_DIAG = { erros: erros, mostrar: mostrar };
})();
</script>

<!-- Checagem final: se depois de 4 s a tela de carregamento ainda estiver lá
     e a aplicação não existir, aponta exatamente qual arquivo não chegou.
     Sem isso, a falha de um único script vira "carregando para sempre". -->
<script>
(function () {
  function faltantes() {
    var modulos = [
      ['core.js', function () { return window.MI && MI.fmt && MI.el; }],
      ['data-cities.js', function () { return MI.CIDADES; }],
      ['data-synthetic.js', function () { return MI.gerarBaseDemo; }],
      ['data-schema.js', function () { return MI.inferSchema; }],
      ['data-classify.js', function () { return MI.classify; }],
      ['data-store.js', function () { return MI.store; }],
      ['data-stats.js', function () { return MI.stats; }],
      ['data-privacy.js', function () { return MI.privacy; }],
      ['data-import.js', function () { return MI.importer; }],
      ['data-full-workbook.js', function () { return MI.fullWorkbook; }],
      ['data-full-import.js', function () { return MI.fullData; }],
      ['data-full-storage.js', function () { return MI.fullBatchStore; }],
      ['view-full-import.js', function () { return MI.fullData && MI.fullData.render; }],
      ['data-catalog-smoov.js', function () { return MI.catalogoSmoov; }],
      ['data-catalog.js', function () { return MI.catalog; }],
      ['data-transactions.js', function () { return MI.tx; }],
      ['data-txstats.js', function () { return MI.txStats; }],
      ['ui-charts.js', function () { return MI.charts; }],
      ['ui-components.js', function () { return MI.ui; }],
      ['ui-geo.js', function () { return MI.geo; }],
      ['geo-urban.js', function () { return MI.geoUrban; }],
      ['data-units.js', function () { return MI.unidades; }],
      ['data-cobertura.js', function () { return MI.cobertura; }],
      ['polygon-clipping.umd.min.js', function () { return window.polygonClipping; }],
      ['store-coverage.js', function () { return MI.storeCoverage; }],
      ['data-store-intelligence.js', function () { return MI.storeIntelligence; }],
      ['ui-store-layers.js', function () { return MI.storeLayers; }],
      ['view-store-intelligence.js', function () { return MI.storePanel; }],
      ['data-import-unico.js', function () { return MI.importUnico; }],
      ['view-import-unico.js', function () { return MI.importUnicoUI; }],
      ['data-bases.js', function () { return MI.bases; }],
      ['view-bases.js', function () { return MI.basesUI; }],
      ['ui-geomap.js', function () { return MI.geoMap; }],
      ['view-overview.js', function () { return MI.views && MI.views.overview; }],
      ['view-catalog.js', function () { return MI.views && MI.views.catalog; }],
      ['view-consumption.js', function () { return MI.views && MI.views.consumption; }],
      ['view-settings.js', function () { return MI.views && MI.views.settings; }],
      ['auth-supabase.js', function () { return MI.auth; }],
      ['app.js', function () { return MI.app; }]
    ];
    var faltando = [];
    for (var i = 0; i < modulos.length; i++) {
      var ok = false;
      try { ok = !!modulos[i][1](); } catch (e) { ok = false; }
      if (!ok) faltando.push(modulos[i][0]);
    }
    return faltando;
  }

  /* Arquivo faltando é falha definitiva: não adianta esperar, avisa logo. */
  setTimeout(function () {
    var boot = document.getElementById('boot');
    if (!boot || boot.hidden) return;
    var faltando = faltantes();
    if (!faltando.length) return;
    var diag = window.MI_DIAG;
    if (!diag) return;
    diag.erros.push('primeiro arquivo que falhou: ' + faltando[0]);
    if (faltando.length > 1) diag.erros.push('também faltam: ' + faltando.slice(1, 6).join(', '));
    diag.erros.push('bibliotecas externas — Chart: ' + (!!window.Chart) +
      ', XLSX: ' + (!!window.XLSX) + ', jsPDF: ' + !!(window.jspdf) + ', pdf.js: ' + (!!window.pdfjsLib));
    diag.mostrar('A aplicação não carregou por completo.');
  }, 6000);

  /* Tudo carregou mas a inicialização não terminou nem o vigia do boot agiu:
     só falar depois de 30 s, para não alarmar máquina lenta. */
  setTimeout(function () {
    var boot = document.getElementById('boot');
    if (!boot || boot.hidden) return;
    if (faltantes().length) return;
    var diag = window.MI_DIAG;
    if (!diag) return;
    var etapa = (document.getElementById('boot-msg') || {}).textContent || '(sem mensagem)';
    diag.erros.push('todos os arquivos carregaram; a inicialização parou em: ' + etapa);
    diag.erros.push('navegador: ' + navigator.userAgent.slice(0, 110));
    diag.mostrar('A inicialização não terminou.');
  }, 30000);
})();
</script>
