<title>10 Move Intelligence</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plataforma de inteligência de dados para a parceria 10 Move × Smoov: importação local de planilhas, dashboards e compartilhamento controlado de indicadores.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/app.css">

<!-- ===================== Carregamento ===================== -->
<div id="boot">
  <div class="boot__inner">
    <div class="boot__logo">
      <span class="boot__mark">10</span>
      <span class="boot__name">10&nbsp;Move Intelligence</span>
    </div>
    <div class="boot__bar"><i id="boot-bar"></i></div>
    <p class="boot__msg" id="boot-msg">Iniciando…</p>
  </div>
</div>

<!-- ===================== Aplicação ===================== -->
<div class="app" id="app" hidden>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand__mark">10</span>
      <span class="brand__text">
        <span class="brand__name">10 Move Intelligence</span>
        <span class="brand__sub">Smoov · parceria</span>
      </span>
    </div>

    <nav class="nav" id="nav" aria-label="Seções da plataforma"></nav>

    <div class="sidebar__foot">
      <div class="persp">
        <div class="persp__label">Perspectiva de acesso</div>
        <div class="persp__switch persp__switch--3" role="group" aria-label="Alternar perfil de acesso">
          <button class="persp__btn is-on" type="button" data-persp="smoov">
            Smoov <small>admin</small>
          </button>
          <button class="persp__btn" type="button" data-persp="tenmove">
            10 Move <small>aprovados</small>
          </button>
          <button class="persp__btn" type="button" data-persp="tech">
            Técnico <small>sistema</small>
          </button>
        </div>
        <p class="persp__note" id="persp-note"></p>
      </div>
      <p class="sidebar__demo" id="sidebar-demo"></p>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="topbar__burger" id="burger" type="button" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topbar__title">
        <h1 id="title">Visão geral</h1>
        <p id="subtitle">Leitura executiva da base ativa</p>
      </div>
      <div class="topbar__actions">
        <span class="ds-chip" title="Base de dados ativa">
          <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7.2" ry="2.8"/><path d="M4.8 6v12c0 1.5 3.2 2.8 7.2 2.8s7.2-1.3 7.2-2.8V6"/><path d="M4.8 12c0 1.5 3.2 2.8 7.2 2.8s7.2-1.3 7.2-2.8"/></svg>
          <span>
            <strong id="ds-name">—</strong>
            <br><span id="ds-meta" style="font-size:11px"></span>
          </span>
        </span>
        <button class="btn btn--sm" id="btn-filters" type="button">
          <svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6.2 7.4V19l-3.6-2v-4.6L4 5Z"/></svg>
          Filtros
        </button>
      </div>
    </header>

    <div class="filterbar" id="filterbar"></div>

    <main class="content" id="view"></main>
  </div>
</div>

<!-- ===================== Painel de filtros ===================== -->
<div class="backdrop" id="backdrop"></div>
<aside class="panel" id="panel" aria-label="Filtros">
  <div class="panel__head">
    <h3>Filtros do recorte</h3>
    <button class="btn btn--sm btn--ghost" id="panel-close" type="button" aria-label="Fechar">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="panel__body" id="panel-body"></div>
  <div class="panel__foot">
    <button class="btn btn--accent" id="panel-done" type="button">Ver resultado</button>
    <button class="btn btn--ghost" id="panel-clear" type="button">Limpar filtros</button>
  </div>
</aside>
